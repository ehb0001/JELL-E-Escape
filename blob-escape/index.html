<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="JELL-E: Escape the Lab - A mobile puzzle game where walls change your powers">

    <title>JELL-E: Escape the Lab</title>

    <link rel="stylesheet" href="css/style.css?v=4">

    <!-- Favicon (inline SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
</head>
<body class="at-title">

    <div id="app-layout">
        <header id="title-bar">
            <div id="title-bar-stage">
                <div id="title-bar-stage-num">Stage</div>
                <div id="title-bar-stage-name">JELL-E</div>
            </div>
            <div id="title-bar-state">
                <span id="title-bar-state-icon">○</span>
                <span id="title-bar-state-name">Normal</span>
            </div>
            <div id="title-bar-moves">Moves: 0</div>
            <button id="title-bar-restart" aria-label="Restart level">↺</button>
        </header>

        <div id="main-row">
            <main id="game-container">
                <canvas id="game"></canvas>
            </main>

            <aside id="sidebar">
                <!-- Reserved for view controls, minimap, buttons, etc. -->
            </aside>
        </div>
    </div>

    <div id="ui-overlay"></div>

    <!-- Scripts (load in dependency order) -->
    <script src="js/constants.js?v=4"></script>
    <script src="js/effects.js?v=3"></script>
    <script src="js/input.js?v=3"></script>
    <script src="js/level_new.js?v=10"></script>
    <script src="js/player.js?v=7"></script>
    <script src="js/game.js?v=17"></script>

</body>
</html>

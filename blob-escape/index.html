<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="description" content="JELL-E: Escape the Lab - A mobile puzzle game where walls change your powers">

    <title>JELL-E: Escape the Lab</title>

    <link rel="stylesheet" href="css/style.css?v=5">

    <!-- Favicon (inline SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
</head>
<body class="at-title">

    <div id="app-layout">
        <header id="title-bar">
            <div id="title-bar-stage">
                <div id="title-bar-stage-num">Stage</div>
                <div id="title-bar-stage-name">JELL-E</div>
            </div>
            <div id="title-bar-state">
                <span id="title-bar-state-icon">○</span>
                <span id="title-bar-state-name">Normal</span>
            </div>
            <div id="title-bar-moves">Moves: 0</div>
            <button id="title-bar-restart" aria-label="Restart level">↺</button>
        </header>

        <div id="main-row">
            <main id="game-container">
                <canvas id="game"></canvas>
            </main>

            <aside id="sidebar">
                <section class="sidebar-card view-card" aria-labelledby="view-map-title">
                    <div class="sidebar-heading">
                        <div>
                            <span class="sidebar-kicker">MAP ORIENTATION</span>
                            <h2 id="view-map-title">현재 맵 시점</h2>
                        </div>
                        <span class="key-hint">TAB</span>
                    </div>
                    <canvas id="map-orientation" role="img" aria-label="현재 보고 있는 맵 슬라이스"></canvas>
                    <div id="view-label" class="view-label">정면 (X-Y)</div>
                    <div id="view-detail" class="view-detail">맵 정보를 불러오는 중</div>
                </section>

                <section class="sidebar-card minimap-card" aria-labelledby="minimap-title">
                    <div class="sidebar-heading">
                        <div>
                            <span class="sidebar-kicker">LIVE POSITION</span>
                            <h2 id="minimap-title">탑뷰 미니맵</h2>
                        </div>
                    </div>
                    <div id="minimap-viewport" class="minimap-viewport">
                        <canvas id="topview-minimap" role="img" aria-label="플레이어와 목표 지점의 탑뷰 위치"></canvas>
                    </div>
                    <div id="minimap-ratio" class="minimap-ratio">실제 비율 X:Z</div>
                    <div class="map-legend" aria-hidden="true">
                        <span><i class="legend-player"></i>현재 위치</span>
                        <span><i class="legend-goal"></i>목표</span>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <div id="ui-overlay"></div>

    <!-- Scripts (load in dependency order) -->
    <script src="js/constants.js?v=4"></script>
    <script src="js/effects.js?v=3"></script>
    <script src="js/input.js?v=3"></script>
    <script src="js/level_new.js?v=10"></script>
    <script src="js/player.js?v=7"></script>
    <script src="js/sidebar.js?v=1"></script>
    <script src="js/game.js?v=18"></script>

</body>
</html>
